<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDNIS</title>
<style>
  @font-face {
    font-family: "Pixelify Sans";
    src: url("assets/PixelifySans-Regular.ttf") format("truetype");
    font-weight: 400 700;
    font-display: swap;
  }

  /* ---- palette, sampled from the Canva mockup ---- */
  :root {
    --bg:          #0e2b2b;
    --glow-cyan:   rgba(0, 196, 204, .07);
    --glow-purple: rgba(125, 42, 232, .07);
    --tile-row1:   #17544d;
    --tile-row2:   #2e8560;
    --sage:        #8fbf99;
    --sage-hover:  #9ecda7;
    --on-sage:     #16493f;
    --mint:        #e6f3ea;
    --green:       #4c9d78;
    --white:       #ffffff;
    --well:        #071b1b;
    --well-line:   rgba(120, 190, 160, .22);
    --ok:          #7fd7a0;
    --err:         #f0a9ae;
    --mono:        "Consolas", ui-monospace, "DejaVu Sans Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background:
      radial-gradient(55% 38% at 12% 6%, var(--glow-cyan), transparent 70%),
      radial-gradient(50% 38% at 90% 94%, var(--glow-purple), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--mint);
    font-family: "Pixelify Sans", "Consolas", ui-monospace, monospace;
    font-weight: 400;
    font-size: 11px;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  /* everything lives in #app so the window-scale setting can zoom it as one
     unit (zoom, not transform: scale — zoom reflows, so the body grows with it
     and nothing gets clipped by overflow:hidden). */
  #app {
    position: relative;
    width: 300px;
    padding: 0 11px 10px;
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 9px 0 0;
    -webkit-app-region: drag;
  }
  .winbtns { display: flex; gap: 1px; -webkit-app-region: no-drag; }
  .winbtns button {
    appearance: none; border: 0; background: transparent;
    color: var(--green);
    font-family: "Segoe UI Symbol", "Segoe UI", sans-serif;
    font-size: 13px;
    cursor: pointer; padding: 1px 5px; line-height: 1; border-radius: 4px;
  }
  .winbtns button:hover { color: var(--mint); background: rgba(230,243,234,.08); }

  h1 {
    font-size: 18px;
    font-weight: 500;
    color: var(--mint);
    letter-spacing: .6px;
    line-height: 1;
  }
  .subtitle {
    font-family: var(--mono);
    color: var(--green);
    font-size: 10px;
    line-height: 1.3;
    margin: 4px 0 7px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .tile {
    appearance: none;
    font: inherit;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .5px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.2;
    color: var(--white);
    border: 0;
    border-radius: 6px;
    min-height: 44px;
    padding: 4px;
    cursor: pointer;
    transition: opacity .12s ease, box-shadow .12s ease, transform .05s ease;
  }
  .tile[data-key="so"], .tile[data-key="ra"]        { background: var(--tile-row1); }
  .tile[data-key="tracking"], .tile[data-key="ecom"] { background: var(--tile-row2); }

  .tile[aria-pressed="false"] { opacity: .6; }
  .tile:hover { opacity: .88; }
  .tile:active { transform: translateY(1px); }
  .tile[aria-pressed="true"] {
    opacity: 1;
    box-shadow: inset 0 0 0 2px rgba(230, 243, 234, .5);
  }

  .btn {
    appearance: none;
    font: inherit;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    width: 100%;
    color: var(--on-sage);
    background: var(--sage);
    border: 0;
    border-radius: 9px;
    padding: 7px 0;
    cursor: pointer;
    transition: background .12s ease, opacity .12s ease, transform .05s ease;
  }
  .btn:hover:not([disabled]) { background: var(--sage-hover); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn-open { margin-top: 7px; }
  .btn-search { margin-top: 6px; }

  /* status sits at the bottom and grows/shrinks with its text */
  .status {
    margin-top: 10px;
    border-radius: 5px;
    background: var(--well);
    box-shadow: inset 0 0 0 1px var(--well-line);
    color: var(--green);
    padding: 6px 9px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.4;
    min-height: 22px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .status.success { color: var(--ok); }
  .status.error   { color: var(--err); }

  .field-label {
    font-family: var(--mono);
    color: var(--green);   /* same as .subtitle */
    font-size: 9.5px;
    line-height: 1.3;
    margin: 12px 0 4px;
  }

  input[type="text"] {
    font-family: var(--mono);
    font-size: 11px;
    width: 100%;
    background: var(--well);
    color: var(--mint);
    border: 0;
    box-shadow: inset 0 0 0 1px var(--well-line);
    border-radius: 6px;
    padding: 6px 10px;
    outline: none;
    transition: box-shadow .12s ease;
  }
  input[type="text"]::placeholder { color: var(--green); }
  input[type="text"]:focus { box-shadow: inset 0 0 0 2px rgba(120, 190, 160, .5); }

  /* ---- settings popover (window scale) ---- */
  .settings {
    position: absolute;
    top: 27px; right: 11px;
    z-index: 40;
    -webkit-app-region: no-drag;
    background: var(--bg);
    box-shadow: 0 0 0 1px var(--well-line), 0 8px 22px rgba(0, 0, 0, .45);
    border-radius: 8px;
    padding: 9px;
  }
  .settings-label {
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: .5px;
    color: var(--green);
    margin-bottom: 6px;
  }
  .scale-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .scale-opts button {
    font-family: var(--mono); font-size: 9.5px;
    background: var(--tile-row1); color: var(--mint);
    border: 0; border-radius: 5px; padding: 6px 2px; cursor: pointer;
    transition: filter .12s ease;
  }
  .scale-opts button:hover { filter: brightness(1.15); }
  .scale-opts button[aria-current="true"] { background: var(--sage); color: var(--on-sage); }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(3, 12, 12, .84);
    display: none; align-items: center; justify-content: center;
    padding: 14px;
  }
  .overlay.show { display: flex; }
  .picker {
    background: var(--bg);
    box-shadow: 0 0 0 1px var(--well-line);
    border-radius: 9px;
    padding: 13px;
    width: 100%;
  }
  .picker h2 { font-size: 11px; color: var(--mint); font-weight: 500; margin-bottom: 9px; }
  .picker .pick {
    display: block; width: 100%; text-align: left;
    font: inherit; font-size: 10.5px;
    background: var(--tile-row1); color: var(--mint);
    border: 0; border-radius: 6px;
    padding: 7px 9px; margin-bottom: 6px;
    cursor: pointer;
    transition: filter .12s ease;
  }
  .picker .pick:hover { filter: brightness(1.12); }
  .picker .pick-all {
    background: var(--sage); color: var(--on-sage);
    margin-top: 3px;
  }
  .picker .cancel {
    display: block; width: 100%; margin-top: 2px;
    background: transparent; color: var(--green);
    border: 0; font: inherit; font-size: 10.5px; padding: 6px; cursor: pointer;
  }
  .picker .cancel:hover { color: var(--mint); }

  .footer {
    font-family: var(--mono);
    text-align: center;
    color: var(--green);
    font-size: 9px;
    letter-spacing: .5px;
    margin-top: 9px;
    opacity: .75;
  }
</style>
</head>
<body>
<div id="app">
  <div class="titlebar">
    <h1>eDesk &amp; NetSuite</h1>
    <div class="winbtns">
      <button id="gearBtn" title="Settings">&#x2699;</button>
      <button id="minBtn" title="Minimize">&#x2013;</button>
      <button id="closeBtn" title="Close">&#x2715;</button>
    </div>
  </div>

  <div class="settings" id="settings" hidden>
    <div class="settings-label">WINDOW SCALE</div>
    <div class="scale-opts" id="scaleOpts">
      <button data-scale="1">1&times;</button>
      <button data-scale="1.25">1.25&times;</button>
      <button data-scale="1.5">1.5&times;</button>
      <button data-scale="2">2&times;</button>
    </div>
  </div>

  <div class="subtitle">Ticket open in eDesk? Select what to open.</div>

  <div class="grid" id="grid">
    <button class="tile" data-key="so"       aria-pressed="true">Sales Order</button>
    <button class="tile" data-key="ra"       aria-pressed="false">Return<br>Authorization</button>
    <button class="tile" data-key="tracking" aria-pressed="false">Tracking Info</button>
    <button class="tile" data-key="ecom"     aria-pressed="false">Ecom Record<br>(Pre-Sales)</button>
  </div>

  <button class="btn btn-open" id="openBtn">Open Selected</button>

  <div class="field-label">No order number detected? Enter it manually below:</div>
  <input type="text" id="entry" placeholder="e.g. #220461" autocomplete="off" spellcheck="false" />
  <button class="btn btn-search" id="searchBtn">Search This Number (Enter)</button>

  <div class="status" id="status">Ready.</div>

  <div class="footer">&copy; loredans 2026</div>

  <div class="overlay" id="overlay">
    <div class="picker">
      <h2>Multiple tickets are open. Use which one?</h2>
      <div id="pickList"></div>
      <button class="cancel" id="pickCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const appEl = $("app");
  const tiles = [...document.querySelectorAll(".tile")];
  const controls = [...document.querySelectorAll(".tile, .btn")];

  function selection() {
    const s = {};
    tiles.forEach(t => s[t.dataset.key] = t.getAttribute("aria-pressed") === "true");
    return s;
  }

  tiles.forEach(t => t.addEventListener("click", () => {
    if (t.disabled) return;
    const on = t.getAttribute("aria-pressed") === "true";
    t.setAttribute("aria-pressed", String(!on));
  }));

  function callApi(fn, ...args) {
    if (window.pywebview && window.pywebview.api) window.pywebview.api[fn](...args);
  }

  // ---- window scale ----
  const SCALES = [1, 1.25, 1.5, 2];
  let scale = 1;
  try {
    const saved = parseFloat(localStorage.getItem("ednis-scale"));
    if (SCALES.includes(saved)) scale = saved;
  } catch (e) {}

  function applyScale(s, save) {
    scale = SCALES.includes(s) ? s : 1;
    appEl.style.zoom = scale === 1 ? "" : scale;
    [...$("scaleOpts").children].forEach(b => {
      b.setAttribute("aria-current", String(parseFloat(b.dataset.scale) === scale));
    });
    if (save) { try { localStorage.setItem("ednis-scale", String(scale)); } catch (e) {} }
    fitWindow();
  }

  $("gearBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    $("settings").hidden = !$("settings").hidden;
  });
  document.addEventListener("click", (e) => {
    if (!$("settings").hidden && !$("settings").contains(e.target) && e.target !== $("gearBtn")) {
      $("settings").hidden = true;
    }
  });
  [...$("scaleOpts").children].forEach(b => {
    b.addEventListener("click", () => {
      applyScale(parseFloat(b.dataset.scale), true);
      $("settings").hidden = true;
    });
  });

  $("minBtn").addEventListener("click", () => callApi("minimize"));
  $("closeBtn").addEventListener("click", () => callApi("close"));

  $("openBtn").addEventListener("click", () => {
    const s = selection();
    if (!Object.values(s).some(Boolean)) {
      window.app.setStatus("Pick at least one thing to open first.", "error");
      return;
    }
    callApi("open_selected", s);
  });

  function runSearch() {
    const s = selection();
    callApi("search_manual", $("entry").value, s.so, s.ra);
  }
  $("searchBtn").addEventListener("click", runSearch);
  $("entry").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

  $("pickCancel").addEventListener("click", () => {
    $("overlay").classList.remove("show");
    callApi("resolve_pick", null);
  });

  // Ask the native window to hug our rendered size (x window scale). Runs on
  // load, on every status change (the box grows with its text), and on scale.
  let fitTimer;
  function fitWindow() {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => {
      // getBoundingClientRect reflects the zoom, so this is the real on-screen
      // size at any scale.
      const r = appEl.getBoundingClientRect();
      callApi("fit", Math.ceil(r.width), Math.ceil(r.height));
    }, 30);
  }
  function scheduleFit() { fitWindow(); setTimeout(fitWindow, 90); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);
  window.addEventListener("load", scheduleFit);
  applyScale(scale, false);

  window.app = {
    setStatus(text, state) {
      const el = $("status");
      el.textContent = text;
      el.className = "status" + (state === "success" || state === "error" ? " " + state : "");
      fitWindow();
    },
    setBusy(busy) { controls.forEach(c => c.disabled = !!busy); },
    clearEntry() { $("entry").value = ""; },
    showPicker(labels, allowAll) {
      const list = $("pickList");
      list.innerHTML = "";
      const choose = (val) => {
        $("overlay").classList.remove("show");
        callApi("resolve_pick", val);
      };
      labels.forEach((label, i) => {
        const b = document.createElement("button");
        b.className = "pick";
        b.textContent = label;
        b.addEventListener("click", () => choose(i));
        list.appendChild(b);
      });
      if (allowAll) {
        const b = document.createElement("button");
        b.className = "pick pick-all";
        b.textContent = "Open ALL " + labels.length + " tickets";
        b.addEventListener("click", () => choose("all"));
        list.appendChild(b);
      }
      $("overlay").classList.add("show");
    },
  };
</script>
</body>
</html>
